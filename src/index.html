<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>opencode Session Editor</title>
<style>
:root {
  --bg: #1a1a1a;
  --bg-card: #242424;
  --bg-card-2: #2c2c2c;
  --bg-input: #1e1e1e;
  --border: #383838;
  --border-strong: #4a4a4a;
  --text: #e8e8e8;
  --text-dim: #9a9a9a;
  --text-faint: #6a6a6a;
  --blue: #4a9eff;
  --blue-bg: #1e3a5f;
  --green: #4ec9a8;
  --green-bg: #1e3f38;
  --red: #ff5c5c;
  --red-bg: #3a1e1e;
  --orange: #d4a04a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button {
  font-family: var(--sans);
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--bg-card-2);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  transition: background .12s, border-color .12s;
}
button:hover { background: var(--border); }
button:active { transform: translateY(1px); }
button.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  font-weight: 600;
}
button.primary:hover { background: #3a8ae5; }
button.primary:disabled, button:disabled {
  opacity: .35; cursor: not-allowed; transform: none;
}
button.primary:disabled:hover { background: var(--blue); }
button.danger {
  border-color: var(--red);
  color: var(--red);
  background: transparent;
}
button.danger:hover { background: var(--red-bg); }
button.icon {
  padding: 4px 8px;
  font-size: 13px;
  line-height: 1;
}
input, textarea, select {
  font-family: var(--sans);
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--blue); }
textarea {
  font-family: var(--mono);
  resize: vertical;
  min-height: 60px;
  width: 100%;
}
input.err, textarea.err {
  border-color: var(--red);
  background: var(--red-bg);
}

/* layout */
#app { max-width: 900px; margin: 0 auto; padding: 16px; }
.topbar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.topbar h1 {
  margin: 0; font-size: 18px; font-weight: 600; flex: 1;
  min-width: 180px;
}
.topbar input.title {
  flex: 1; min-width: 180px; font-size: 15px; font-weight: 600;
}

/* loading / empty */
.loading, .empty {
  text-align: center; padding: 60px 20px; color: var(--text-dim);
}
.spinner {
  display: inline-block; width: 22px; height: 22px;
  border: 2px solid var(--border); border-top-color: var(--blue);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* filter bar */
.filter-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px; flex-wrap: wrap;
}
.filter-bar input[type="search"] {
  flex: 1; min-width: 140px;
}
.filter-bar .dir-btn {
  max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.filter-bar label {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--text-dim); cursor: pointer;
  white-space: nowrap;
}
.filter-bar input[type="checkbox"] { cursor: pointer; }

/* session list */
.session-list { display: flex; flex-direction: column; gap: 6px; }
.session-item {
  display: flex; gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color .12s, background .12s;
}
.session-item:hover {
  border-color: var(--border-strong);
  background: var(--bg-card-2);
}

/* agent icon */
.agent-icon {
  width: 30px; height: 30px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
  border: 1px solid;
  flex-shrink: 0;
  font-family: var(--sans);
}

/* session item content */
.s-content { flex: 1; min-width: 0; }
.s-header {
  display: flex; align-items: baseline; gap: 8px;
}
.s-title {
  font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1; min-width: 0;
}
.s-meta {
  display: flex; gap: 8px; flex-shrink: 0;
  font-size: 11px; color: var(--text-faint); font-family: var(--mono);
}
.s-meta .s-model { color: var(--orange); }
.s-snippet {
  margin-top: 3px;
  font-size: 12px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  line-height: 1.4;
  word-break: break-word;
}
.s-sub-tag { color: var(--text-faint); font-style: italic; font-size: 11px; }

/* highlight */
mark {
  background: rgba(212, 160, 74, 0.25);
  color: var(--orange);
  border-radius: 2px;
  padding: 0 1px;
}

/* load more */
.load-more-spin {
  text-align: center; padding: 16px; color: var(--text-dim);
  font-size: 12px;
}
.no-more {
  text-align: center; padding: 12px; color: var(--text-faint);
  font-size: 11px;
}

/* directory picker modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 2000;
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 12vh;
}
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 20px;
  width: 90%; max-width: 560px;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.dir-input { width: 100%; margin-bottom: 8px; font-family: var(--mono); font-size: 13px; }
.dir-suggestions {
  max-height: 220px; overflow-y: auto;
  border: 1px solid var(--border); border-radius: 6px;
  margin-bottom: 12px;
  background: var(--bg-input);
}
.dir-suggestion {
  padding: 7px 12px; cursor: pointer;
  font-family: var(--mono); font-size: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
}
.dir-suggestion:hover, .dir-suggestion.selected {
  background: var(--bg-card-2); color: var(--text);
}
.dir-suggestion:last-child { border-bottom: none; }
.modal-actions {
  display: flex; gap: 8px; align-items: center;
}

/* diff editor layout */
.diff-layout { display: flex; flex-direction: column; height: 100vh; }
.diff-topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-strong);
  flex-shrink: 0; z-index: 100;
}
.diff-topbar input.title { flex: 0 1 300px; font-size: 14px; font-weight: 600; }
.diff-topbar button { white-space: nowrap; }

.diff-container {
  flex: 1; overflow-y: auto;
  font-family: var(--mono); font-size: 13px; line-height: 1.6;
  scrollbar-width: none; -ms-overflow-style: none;
}
.diff-container::-webkit-scrollbar { display: none; }

.diff-body { display: flex; flex: 1; overflow: hidden; }

.diff-minimap {
  width: 60px; flex-shrink: 0;
  background: rgba(0,0,0,.3);
  border-left: 1px solid var(--border);
  position: relative; cursor: pointer;
  overflow: hidden; user-select: none;
}
.minimap-bar {
  border-left: 3px solid transparent;
  min-height: 2px;
}
.minimap-bar.mm-modified { background: rgba(255,90,90,.08); }
.minimap-bar.mm-added { background: rgba(80,200,120,.12); }
.minimap-bar.mm-removed { background: rgba(255,90,90,.12); }
.minimap-viewport {
  position: absolute; left: 0; right: 0;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 2px; pointer-events: none;
}

.diff-header {
  display: grid; grid-template-columns: 6px 1fr 1fr 14px;
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border-strong);
}
.diff-gutter-spacer { width: 6px; }
.diff-col-label {
  padding: 6px 12px; font-size: 11px; color: var(--text-dim);
  font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
}

.diff-row {
  display: grid; grid-template-columns: 6px 1fr 1fr 14px;
  border-bottom: 1px solid var(--border);
  min-height: 28px;
}
.diff-gutter { width: 6px; }
.diff-delete-gutter {
  width: 14px; background: transparent;
  transition: background .12s;
}
.diff-delete-gutter.clickable { cursor: pointer; }
.diff-delete-gutter.clickable:hover { background: var(--red); }

.diff-cell {
  padding: 4px 10px; position: relative;
  overflow-wrap: break-word; word-break: break-word;
}
.diff-cell.left {
  border-right: 1px solid var(--border);
  white-space: pre-wrap; color: var(--text-dim);
}

.diff-row.modified > .left { background: rgba(255,90,90,.05); }
.diff-row.modified > .right { background: rgba(80,200,120,.05); }
.diff-row.removed > .left { background: rgba(255,90,90,.08); }
.diff-row.added > .right { background: rgba(80,200,120,.08); }

.text-diff-block { display: flex; flex-direction: column; }
.diff-line { min-height: 1.6em; padding: 0 2px; }
.diff-line.removed { background: rgba(255,80,80,.18); color: var(--text); }
.diff-line.placeholder { background: rgba(0,0,0,.2); min-height: 1.6em; }

.diff-cell.right textarea.text-edit {
  width: 100%; background: transparent;
  border: 1px solid transparent; color: var(--text);
  font-family: var(--mono); font-size: 13px; line-height: 1.6;
  padding: 0 2px; resize: none; overflow: hidden;
  outline: none; border-radius: 3px;
}
.diff-cell.right textarea.text-edit:focus {
  border-color: var(--blue); background: rgba(74,158,255,.06);
}
.diff-cell.right textarea.reasoning { color: var(--text-dim); font-style: italic; }

.tool-line {
  font-family: var(--sans); font-size: 12px; color: var(--text-faint);
  padding: 3px 6px; margin: 2px 0;
  background: rgba(0,0,0,.2); border-radius: 3px;
}
.tool-block { margin: 3px 0; white-space: normal; min-width: 0; }
.tool-block > summary { cursor: pointer; color: var(--text-dim); user-select: none; }
.tool-body { padding: 2px 6px 6px; border-left: 2px solid var(--border); }
.tool-field { margin: 4px 0; }
.tool-field > summary { cursor: pointer; font-size: 12px; color: var(--text-dim); user-select: none; }
.tool-field > summary.invalid { color: var(--red); }
.tool-edit {
  display: block; width: 100%; min-height: 72px; max-height: 320px;
  margin-top: 6px; padding: 8px; resize: vertical; overflow: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.6;
  white-space: pre; word-break: normal; overflow-wrap: normal;
}
.tool-edit[readonly] { color: var(--text-dim); }
.tool-error { color: var(--red); font-size: 12px; margin: 4px 0; overflow-wrap: anywhere; }
.reasoning-line { color: var(--text-faint); font-style: italic; padding: 0 2px; white-space: pre-wrap; }
.other-line { color: var(--text-faint); font-size: 11px; padding: 0 2px; }

.reasoning-wrap { position: relative; }

.add-reasoning-btn {
  font-size: 11px; color: var(--text-faint);
  padding: 2px 8px; margin-top: 4px;
  border: 1px dashed var(--border);
  background: transparent; border-radius: 4px;
}
.add-reasoning-btn:hover { color: var(--text-dim); border-color: var(--border-strong); }

.diff-placeholder { min-height: 28px; background: rgba(0,0,0,.15); }

.del-reasoning-btn {
  font-size: 11px; color: var(--text-faint);
  padding: 2px 8px; margin-top: 2px;
  border: 1px dashed var(--border);
  background: transparent; border-radius: 4px;
  opacity: 0; transition: opacity .15s;
}
.reasoning-wrap:hover .del-reasoning-btn { opacity: 1; }
.del-reasoning-btn:hover { color: var(--red); border-color: var(--red); }

.diff-add-zone { padding: 12px; text-align: center; }

/* toast */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--bg-card-2); border: 1px solid var(--border-strong);
  padding: 10px 18px; border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.5);
  z-index: 3000; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
#toast.err { border-color: var(--red); color: var(--red); }
#toast.ok { border-color: var(--green); }

@media (max-width: 600px) {
  .diff-cell { padding: 4px 6px; font-size: 12px; }
  .diff-topbar { padding: 6px 10px; gap: 6px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
